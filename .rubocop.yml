plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/queue_schema.rb"
    - "db/cache_schema.rb"
    - "db/cable_schema.rb"
    - "db/migrate/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "storage/**/*"

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false